name: Build executables

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            # Build inside bullseye (glibc 2.31) so the binary runs on
            # Ubuntu 20.04+ / Debian 11+ / RHEL 9+. A native ubuntu-latest
            # build would link the runner's much newer glibc and fail with
            # "GLIBC_x.yy not found" on older agent hosts.
            container: python:3.12-slim-bullseye
          - os: windows-latest
            platform: windows
            container: ''
          - os: macos-latest
            platform: macos
            container: ''
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4

      # PyInstaller needs objdump; bullseye is an archived release, so its
      # Release files are past their Valid-Until date — tell apt to accept them.
      - name: Install PyInstaller prerequisites (container)
        if: matrix.platform == 'linux'
        run: |
          apt-get -o Acquire::Check-Valid-Until=false update -qq
          apt-get install -y -qq --no-install-recommends binutils

      - uses: actions/setup-python@v5
        if: matrix.platform != 'linux'
        with:
          python-version: '3.12'

      # poetry.lock is the single source of pinned versions; installing through
      # Poetry means a rebuild ships exactly the tested set instead of
      # re-resolving pyproject.toml's ranges at build time. PyInstaller is
      # locked too (the "build" group).
      - name: Install dependencies (locked)
        run: |
          pip install poetry==2.4.2
          poetry install --only main,build

      - name: Build executable
        run: poetry run pyinstaller --onefile --name rfi_compare rfi_compare.py

      - uses: actions/upload-artifact@v4
        with:
          name: rfi_comparison_script-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  # Combine the three platform builds into a single "dist" artifact with
  # macos/, windows/, and linux/ subdirectories.
  assemble-dist:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staging
          pattern: rfi_comparison_script-*

      - name: Arrange platform subdirectories
        run: |
          mkdir -p dist
          for platform in linux windows macos; do
            mv "staging/rfi_comparison_script-${platform}" "dist/${platform}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      # Zip preserves the executable bit, which a raw asset upload would lose.
      - name: Zip per-platform builds
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          for platform in linux windows macos; do
            (cd dist && zip -r "rfi_comparison_script-${platform}.zip" "${platform}")
          done

      - name: Create GitHub Release with binaries
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/rfi_comparison_script-*.zip \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
